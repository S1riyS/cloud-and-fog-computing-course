filebeat.inputs:
  - type: filestream
    id: app-logs
    paths: [/logs/*.log]
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true

processors:
  # время события берём из поля ts, которое пишет приложение
  - timestamp:
      field: ts
      layouts:
        - '2006-01-02T15:04:05.000Z07:00'
        - '2006-01-02T15:04:05.000'
      ignore_missing: true
      ignore_failure: true

setup.ilm.enabled: false
setup.template.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "app-logs-%{+yyyy.MM.dd}"

logging.level: warning
