global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ['gateway:3001'] }]
  - job_name: orders
    static_configs: [{ targets: ['orders:3002'] }]
  - job_name: payments
    static_configs: [{ targets: ['payments:3003'] }]
  - job_name: cadvisor
    static_configs: [{ targets: ['cadvisor:8080'] }]
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]
