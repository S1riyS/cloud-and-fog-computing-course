version: "3.8"
services:
  web:
    image: python:3.11-alpine
    environment:
      - TASK_SLOT={{.Task.Slot}}
    command:
      - "python"
      - "-u"
      - "-c"
      - "import http.server, socket, os; server = http.server.HTTPServer(('0.0.0.0', 5678), type('H', (http.server.BaseHTTPRequestHandler,), {'do_GET': lambda s: (s.send_response(200), s.send_header('Content-Type', 'text/plain; charset=utf-8'), s.end_headers(), s.wfile.write(f'Hello from Swarm! Container ID: {socket.gethostname()} | Slot: {os.environ.get(\"TASK_SLOT\", \"N/A\")}\\n'.encode()))})); server.serve_forever()"
    ports:
      - target: 5678
        published: 8080
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
